# .factory.yml — read by the factory hooks and orchestrators.
# Approved stack: Next.js App Router, React, TypeScript (see CLAUDE.md). The application lives at the
# repository root. The stack is registered as `react` to match the factory routing (react-builder, stack-react).
layout: monorepo
default_branch: main
areas:
  web: { path: ., stack: react }
commands:
  check: npm run check
