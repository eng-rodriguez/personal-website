# .github/workflows/pr-format.yml — checks the PR title and sections.
name: pr-format
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
jobs:
  pr-format:
    # Dependabot writes its own title and body, so the three-section check does not apply.
    # A skipped job counts as passing for required status checks.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check title and sections
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          [ "${#TITLE}" -le 72 ] || { echo "::error::Title is longer than 72 characters"; exit 1; }
          echo "$TITLE" | grep -Eq '^(feat|fix|refactor|perf|test|docs|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$' \
            || { echo "::error::Title must be a Conventional Commit, e.g. feat(orders): add bulk cancel"; exit 1; }
          for h in '## Summary' '## Why' '## Technical Notes'; do
            printf '%s\n' "$BODY" | grep -q "^$h" || { echo "::error::Missing section: $h"; exit 1; }
          done
